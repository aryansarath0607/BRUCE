[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bruce-agent"
version = "0.4.0"
description = "A safety-first, provider-independent personal AI agent for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
voice = ["SpeechRecognition>=3.10", "PyAudio>=0.2.14", "pyttsx3>=2.90"]
all = ["SpeechRecognition>=3.10", "PyAudio>=0.2.14", "pyttsx3>=2.90", "Pillow>=10.0", "pyautogui>=0.9.54", "pyperclip>=1.8", "playwright>=1.45"]

[project.scripts]
bruce = "bruce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
